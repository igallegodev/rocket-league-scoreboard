# Builds the app zip, plus a small zip with only the Stats API script, and
# attaches both to every published release. The asset names are fixed so the
# README can link to releases/latest/download/<name>.zip
name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir rocket-league-scoreboard
          cp index.html styles.css app.js enable-stats-api.bat enable-stats-api.ps1 README.md README.es.md LICENSE rocket-league-scoreboard/
          zip -r rocket-league-scoreboard.zip rocket-league-scoreboard
          # For people who use the web version and only need the script
          mkdir enable-stats-api
          cp enable-stats-api.bat enable-stats-api.ps1 enable-stats-api/
          zip -r enable-stats-api.zip enable-stats-api

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" rocket-league-scoreboard.zip enable-stats-api.zip --clobber
