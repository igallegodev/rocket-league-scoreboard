<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcador RL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <div class="top">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Sin conexión</span></div>
    <span id="arena"></span>
    <span class="me-status" id="meStatus"></span>
    <span class="spacer"></span>
    <div class="lang" role="group" data-i18n-aria="langGroup" aria-label="Idioma">
      <button data-lang="es" aria-pressed="true" lang="es">ES</button><button data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
    <button id="demoBtn" aria-pressed="false" data-i18n="demo">Modo demo</button>
    <button id="recBtn" aria-pressed="false" data-i18n-title="recordTitle">Grabar registro</button>
    <button id="logBtn" disabled><span data-i18n="download">Descargar registro</span> (<span id="logCount">0</span>)</button>
  </div>

  <section class="board" data-i18n-aria="boardAria" aria-label="Marcador">
    <div class="side blue"><span class="team-name" id="n0"></span><span class="goals" id="g0">0</span></div>
    <div class="clock-wrap">
      <div class="clock" id="clock">5:00</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="side orange"><span class="goals" id="g1">0</span><span class="team-name" id="n1"></span></div>
  </section>

  <div class="touch" data-i18n-aria="touchAria" aria-label="Último toque del balón">
    <span data-i18n="lastTouch">Último toque</span>
    <div class="touch-bar"><span id="touchMark"></span></div>
    <span id="touchText">—</span>
  </div>

  <div class="help" id="help">
    <h2 data-i18n="helpTitle">Esperando al juego</h2>
    <p data-i18n-html="help1"></p>
    <p data-i18n-html="help2"></p>
<pre>[TAGame.MatchStatsExporter_TA]
PacketSendRate=30
WebPort=49124
Port=0</pre>
    <p data-i18n-html="help3"></p>
    <p data-i18n="help4"></p>
  </div>

  <div class="main">
    <div class="tables">
      <div class="tbl blue"><table><thead id="head0"></thead><tbody id="rows0"></tbody></table></div>
      <div class="tbl orange"><table><thead id="head1"></thead><tbody id="rows1"></tbody></table></div>
    </div>
    <aside class="feed" aria-live="polite">
      <h2 data-i18n="feedTitle">Jugadas</h2>
      <ol id="feed"></ol>
      <p id="feedEmpty" data-i18n="feedEmpty"></p>
    </aside>
    <section class="session" data-i18n-aria="sessAria" aria-label="Sesión">
      <div class="sess-head"><h2 data-i18n="sessTitle">Sesión</h2><button id="sessReset" data-i18n="newSession" data-i18n-title="newSessionTitle">Nueva sesión</button></div>
      <div id="sessBody"></div>
    </section>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
